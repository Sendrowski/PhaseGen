n:
  pop_0: 3
n_loci: 2
recombination_rate: 0.0
num_replicates: 200000
seed: 47
pop_sizes:
  pop_0:
    0: 1
model: standard
comparisons:
  tolerance:
    sfs2:
      pairwise:
        # at r = 0 the two loci are perfectly linked, so the two bins are the same random variable and their joint
        # law has no density: only the CDF exists, through the diagonal reduction
        '[(1, 2), (2, 2)]':
          cdf: 0.022
      mean: 0.019
      var: 0.075
