n: 4
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
    1: 10
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      pdf: 0.004
      cdf: 0.002
      quantile: 0.004
      mean: 0.0055
      var: 0.014
    total_branch_length:
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.004
      mean: 0.0053
      var: 0.014
    sfs:
      mean: 0.0093
      cov: 0.029
      corr: 0.025
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.0042
      # on several epochs the nested conditional at its calibration truncation and the derivative identity are each
      # resolved to about 1e-3.
      conditional:
        '[(1, 2), (1, 3), (2, 3)]':
          moments: 0.003
        '[(2, 3)]':
          # the conditional CDF against the de Hoog inversion of its transform (see 1_epoch_n_4)
          dehoog:
            cdf: 0.036
      pairwise:
        "[(1, 2), (1, 3), (2, 3)]":
          cdf: 0.0069
          pdf: 0.038
        (3, 3):
          cdf: 0.002
