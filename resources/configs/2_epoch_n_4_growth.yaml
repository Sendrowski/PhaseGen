n: 4
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
    1: 10
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      pdf: 0.027
      cdf: 0.00078
      quantile: 0.002
      mean: 0.0006
      var: 0.0035
    total_branch_length:
      cosine:
        pdf: 0.044
        cdf: 0.0008
        quantile: 0.0017
      mean: 0.00044
      var: 0.003
    sfs:
      mean: 0.0021
      cov: 0.011
      corr: 0.0043
      cosine:
        pdf: 0.031
        cdf: 0.0036
        quantile: 0.0042
      # multi-epoch, so the identity is no longer exact: de Hoog's own inversion error (~0.2% here, and non-monotone
      # in the degree) sets this tolerance, not the conditional under test. See 4_epoch_up_down_n_4.
      conditional:
        '[(1, 2), (1, 3), (2, 3)]':
          moments: 0.003
      pairwise:
        "[(1, 2), (1, 3), (2, 3)]":
          cdf: 0.0069
          pdf: 0.038
        (3, 3):
          cdf: 0.0012
