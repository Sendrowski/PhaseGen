            cdf: 0.062
            pdf: 0.14
            quantile: 0.13
          # the conditional CDF against the de Hoog inversion of its transform (see 1_epoch_n_4), at the median alone
          dehoog:
            cdf: 0.00011
            quantiles: [0.5]
    empirical:
      tree_height:
        mean: 0.0059
        var: 0.043
        cdf: 0.0053
        pdf: 0.009
