n:
  pop_0: 6
n_samples: 200000
pop_sizes:
  pop_0:
    0: 2
    1.1: 0.3
    3.5: 0.5
    4.2: 8
    7.5: 2.3
model: beta
alpha: 1.5
seed: 42
comparisons:
  tolerance:
    sfs:
      conditional:
        '[(1, 2)]':
          # the reference's floor, not ours: `conditional_moments` (the exact derivative identity) is exact on a
          # single epoch only and rings by +-0.5% here, reaching 1.2% at the far conditioning point (u = 0.99). The
          # conditional mean under test is smooth and monotone in v across that window, the reference is not. The old
          # 0.003 held only because the cosine quantile was truncated ~3% short of q = 0.99 and so landed on a v where
          # the reference's oscillation happened to cross zero.
          moments: 0.019
    empirical:
      tree_height:
        mean: 0.004
        var: 0.013
        cdf: 0.0053
        pdf: 0.02
        quantile: 0.0035
      total_branch_length:
        mean: 0.00087
        var: 0.0075
      sfs:
        mean: 0.0036
        m2: 0.017
