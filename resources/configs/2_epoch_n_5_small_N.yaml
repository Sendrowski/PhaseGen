n: 5
num_replicates: 1000000
n_samples: 200000
simulate_mutations: true
# the exact rescaling of the mutation rate of 2_epoch_n_5_large_N, so theta * E[total branch length] ~ 3 here too
mutation_rate: 300000
mass_threshold: 0.9
pop_sizes:
  pop_0:
    0: 0.000001
    0.000001: 0.000005
model: standard
seed: 42
comparisons:
  tolerance:
    # validate PhaseGen's own trajectory sampler here too: this scenario's rates sit far from unity, and the
    # hazard-budget sampler must be scale-free (it draws H / lambda, which carries no absolute time scale).
    empirical:
      tree_height:
        mean: 0.009
        var: 0.026
        cdf: 0.0045
        pdf: 0.009
        quantile: 0.009
      total_branch_length:
        mean: 0.009
        var: 0.024
      sfs:
        mean: 0.019
        m2: 0.05
    tree_height:
      cdf: 0.002
      mean: 0.0039
      var: 0.01
      pdf: 0.004
      quantile: 0.004
    total_branch_length:
      mean: 0.0037
      var: 0.0096
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.004
    sfs:
      mutation_configs: 0.0044
      mean: 0.0077
      cov: 0.034
      corr: 0.033
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.0048
      # N = 1e-6 across two epochs, the hardest end of the scale, and the exact rescaling of 2_epoch_n_5_large_N (see
      # there). The transform is fine (``moments`` holds to 1e-3), but the conditional's cosine grid rings here
      # (``grid_moments`` reports ~15%), as it does on growth and up_down, so it is deliberately not asserted -- a 20%
      # bound would certify nothing.
      conditional:
        '[(1, 2), (2, 4)]':
          moments: 0.001
        '[(2, 4)]':
          # the atom conditional against the msprime sample (see 1_epoch_n_4). A small-N demography, the opposite reward
          # scale to 1_epoch_n_4_large_N.
          atom:
            mass: 0.002
            mean: 0.0058
            var: 0.015
            cdf: 0.0029
            pdf: 0.0057
            quantile: 0.0057
      pairwise:
        '[(1, 2), (1, 4), (2, 4)]':
          cdf: 0.0036
          pdf: 0.014
    fsfs:
      mutation_configs: 0.004
