n: 5
num_replicates: 1000000
n_samples: 200000
simulate_mutations: true
mutation_rate: 1
mass_threshold: 0.9
pop_sizes:
  pop_0:
    0: 1
    0.3: 0.01
    1: 1
model: standard
seed: 42
comparisons:
  tolerance:
    # validate PhaseGen's own trajectory sampler here too: this scenario's rates sit far from unity, and the
    # hazard-budget sampler must be scale-free (it draws H / lambda, which carries no absolute time scale).
    empirical:
      tree_height:
        mean: 0.00051
        var: 0.067
        cdf: 0.0045
        pdf: 0.009
        quantile: 0.009
      total_branch_length:
        mean: 0.0016
        var: 0.015
      sfs:
        mean: 0.022
        m2: 0.05
    fsfs:
      mutation_configs: 0.004
    tree_height:
      pdf: 0.004
      cdf: 0.002
      mean: 0.00022
      var: 0.029
      quantile: 0.004
    total_branch_length:
      mean: 0.00073
      var: 0.0064
      cosine:
        pdf: 0.0047
        cdf: 0.002
        quantile: 0.004
    sfs:
      mutation_configs: 0.004
      mean: 0.01
      cov: 0.062
      corr: 0.058
      theta_pi: 0.004
      theta_w: 0.004
      tajimas_d: 0.004
      cosine:
        pdf: 0.0057
        cdf: 0.002
        quantile: 0.004
      # no ``moments`` here: the derivative identity is not a trustworthy reference on this demography. It disagrees
      # with the conditional by 12-21%, and it is the identity that is wrong -- f_a(v) is minuscule in the tail of a
      # bottleneck and the identity divides by it, which de Hoog cannot resolve. So the tower check is used instead:
      # weaker (it integrates the conditional back out, so errors at different v can cancel) but honest.
      conditional:
        '[(1, 2), (1, 4), (2, 4)]':
          total_expectation: 0.016
        '[(2, 4)]':
          # the atom conditional against the msprime sample (see 1_epoch_n_4). This is the hardest demography in the
          # suite: the nested conditional cannot be pinned here at all (only the tower check survives, above). The
          # atom transform is a closed-form ratio rather than a nested inversion, so it stays exact even here, which
          # is exactly what makes it worth asserting on this scenario.
          atom:
            mass: 0.002
            mean: 0.0034
            var: 0.007
            cdf: 0.0029
            pdf: 0.0084
            quantile: 0.0057
      pairwise:
        '[(1, 2), (1, 4), (2, 4)]':
          cdf: 0.011
          pdf: 0.13
