n: 5
num_replicates: 1000000
simulate_mutations: true
mutation_rate: 1
mass_threshold: 0.9
pop_sizes:
  pop_0:
    0: 1
    0.3: 0.01
    1: 1
model: standard
seed: 42
comparisons:
  tolerance:
    fsfs:
      mutation_configs: 0.0006
    tree_height:
      pdf: 0.011
      cdf: 0.0008
      mean: 3.1e-05
      var: 0.012
      quantile: 4.6e-05
    total_branch_length:
      mean: 0.00015
      var: 0.00033
      cosine:
        pdf: 0.00027
        cdf: 9.1e-05
        quantile: 0.00015
    sfs:
      mutation_configs: 0.0008
      mean: 0.0011
      cov: 0.017
      corr: 0.018
      theta_pi: 7.6e-05
      theta_w: 0.00015
      tajimas_d: 0.00018
      cosine:
        pdf: 0.028
        cdf: 0.0017
        quantile: 0.003
      # no ``moments`` here: the derivative identity is not a trustworthy reference on this demography. It disagrees
      # with the conditional by 12-21%, and it is the identity that is wrong -- f_a(v) is minuscule in the tail of a
      # bottleneck and the identity divides by it, which de Hoog cannot resolve. So the tower check is used instead:
      # weaker (it integrates the conditional back out, so errors at different v can cancel) but honest.
      conditional:
        '[(1, 2), (1, 4), (2, 4)]':
          total_expectation: 0.016
      pairwise:
        '[(1, 2), (1, 4), (2, 4)]':
          cdf: 0.011
          pdf: 0.13
