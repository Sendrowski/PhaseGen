n: 5
num_replicates: 1000000
n_samples: 200000
simulate_mutations: true
mutation_rate: 1
mass_threshold: 0.9
pop_sizes:
  pop_0:
    0: 1
    0.3: 0.01
    1: 1
model: standard
seed: 42
comparisons:
  tolerance:
    # validate PhaseGen's own trajectory sampler here too: this scenario's rates sit far from unity, and the
    # exit-threshold sampler must be scale-free (it draws H / lambda, which carries no absolute time scale).
    empirical:
      tree_height:
        mean: 0.00051
        var: 0.067
        cdf: 0.0045
        pdf: 0.009
        quantile: 0.009
      total_branch_length:
        mean: 0.0016
        var: 0.015
      sfs:
        mean: 0.022
        m2: 0.05
    fsfs:
      mutation_configs: 0.004
    tree_height:
      pdf: 0.004
      cdf: 0.002
      mean: 0.00022
      var: 0.029
      quantile: 0.004
    total_branch_length:
      mean: 0.00073
      var: 0.0064
      cosine:
        pdf: 0.0047
        cdf: 0.002
        quantile: 0.004
    sfs:
      mutation_configs: 0.004
      mean: 0.01
      cov: 0.062
      corr: 0.058
      theta_pi: 0.004
      theta_w: 0.004
      tajimas_d: 0.004
      cosine:
        pdf: 0.009
        # at the reference's own noise: four times the peak binomial standard error of 1e6 replicates is 0.002, and
        # the diff does not fall as the expansion is refined (0.00206 at 1536 terms, 0.00238 at 3072)
        cdf: 0.0031
        quantile: 0.004
      # the largest error of the conditional mean, 1.2e-2, is at the level 0.99 of R_2 in the pair (2, 4)
      conditional:
        '[(1, 2), (1, 4), (2, 4)]':
          moments: 0.023
          total_expectation: 0.016
        '[(2, 4)]':
          # the atom conditional against the msprime sample (see 1_epoch_n_4). The atom transform is a closed-form
          # ratio, not a nested inversion, so it stays exact on this demography.
          atom:
            mass: 0.002
            mean: 0.0034
            var: 0.007
            cdf: 0.0029
            pdf: 0.0084
            quantile: 0.0057
          # the conditional CDF against the de Hoog inversion of its transform (see 1_epoch_n_4)
          dehoog:
            cdf: 0.0032
      pairwise:
        '[(1, 2), (1, 4), (2, 4)]':
          cdf: 0.011
          pdf: 0.13
