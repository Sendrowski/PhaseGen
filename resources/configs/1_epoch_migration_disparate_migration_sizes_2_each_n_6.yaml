n:
  pop_0: 2
  pop_1: 2
  pop_2: 2
num_replicates: 1000000
record_migration: true
migration_rates:
  !!python/tuple ['pop_0', 'pop_1']:
    0: 3
  !!python/tuple ['pop_1', 'pop_0']:
    0: 4
  !!python/tuple ['pop_0', 'pop_2']:
    0: 1
  !!python/tuple ['pop_2', 'pop_0']:
    0: 15
  !!python/tuple ['pop_1', 'pop_2']:
    0: 6
  !!python/tuple ['pop_2', 'pop_1']:
    0: 10
pop_sizes:
  pop_0:
    0: 1.5
  pop_1:
    0: 0.5
  pop_2:
    0: 1
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      demes:
        mean: 0.01
        var: 0.02
        # cov: 0.01 slight differences between covariance of tree height
        #   and covariance of number of lineages in demes
        # corr: 0.01
      pdf: 0.076
      cdf: 0.0011
      mean: 0.0014
      var: 0.0036
    total_branch_length:
      demes:
        mean: 0.01
        var: 0.02
        # cov: 0.01
        # corr: 0.01
      mean: 0.0013
      var: 0.0029
    sfs:
      demes:
        mean: 0.015
        # var: 0.02 variance not supported by MsprimeCoalescent
      mean: 0.0029
      cov: 0.029
      corr: 0.023
    fsfs:
      demes:
        mean: 0.015
            # var: 0.02 variance not supported by MsprimeCoalescent
      mean: 0.0029
      cov: 0.017
      corr: 0.012
