n: 4
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
model: standard
seed: 42
n_samples: 200000
comparisons:
  tolerance:
    tree_height:
      pdf: 0.0049
      cdf: 0.002
      quantile: 0.004
      mean: 0.0028
      var: 0.011
    total_branch_length:
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.004
      mean: 0.0025
      var: 0.0096
    sfs:
      mean: 0.0063
      cov: 0.032
      corr: 0.032
      cosine:
        pdf: 0.0046
        cdf: 0.002
        quantile: 0.004
      # self-consistency of the conditional path: no msprime operand, so any bin pair may be listed. ``moments`` pins
      # each conditional mean pointwise against the exact derivative identity. ``total_expectation`` is deliberately
      # NOT used here: it is 2-4x dearer and strictly weaker (integrated rather than pointwise, and its own
      # Gauss-Legendre quadrature, not the conditional, sets its floor). ``quantiles`` targets specific conditioning
      # values of the conditioning marginal (omit for the default 0.01-0.99 span), and ``curves`` draws that many
      # conditional densities per axis (~1 s each; nothing is asserted on them). On a single epoch the identity is
      # exact, so this pins the nested inversion to 1e-4.
      conditional:
        '[(1, 2)]':
          moments: 0.0001
          # ``grid_moments`` is the same identity taken against the conditional's cosine cdf/pdf GRID rather than its
          # transform, so it is the only check that reaches that layer -- but it builds a grid per conditioning point,
          # so it is several times dearer and is wired on one pair per config, not on every pair.
          grid_moments: 0.015
          curves: 3        # densities are drawn on this pair only: each costs an endpoint quantile of the conditional
          # the nested conditional against msprime. Every other conditional check is an identity the analytic joint
          # must satisfy, so an error shared by the transform and the identity would pass all of them; this is the
          # only place a *sample* decides, away from the atom.
          #
          # A sample can only estimate the conditional over a window, so both sides are averaged over the same one
          # (the exact side by Gauss-Legendre quadrature, weighted by the conditioning marginal). The O(h) window bias
          # then cancels rather than being corrected for, and what is left is the sample's standard error -- which is
          # why the window can be wide: it buys replicates instead of bias.
          #
          # The mean's tolerance is in SIGMAS of the sample, not a relative difference: with the bias gone it has no
          # floor but the window's own sampling noise, so a sigma is the only scale that keeps its meaning across
          # demographies and replicate counts, and does not quietly loosen as a scenario's replicate count rises.
          windowed:
            # windows of +-20% around the median of the conditioning bin's continuous part (the atom at 0 is skipped).
            # ``nodes`` is the whole cost: each is a nested conditional, and only the ``cdf`` needs its cosine grid.
            # 2 nodes reach 2-4e-4 (8 nodes change nothing beyond 1e-4); 1 node is not a quadrature but the
            # conditional at the window centre, and reinstates the 5e-3 window bias this check exists to remove.
            quantiles: [0.5]
            window: 0.2
            nodes: 2
            mean: 5
            # the conditional's whole law against msprime, and the only external check the nested inversion has.
            # Absolute, not sigmas: the empirical CDF's binomial error collapses in the tails, where a z-score blows
            # up on an agreement that is in fact excellent. The bound is set by msprime's replicate count, not by
            # phasegen -- against a 40M-replicate sample the conditional CDF resolves to ~4e-4 -- so this is a
            # tripwire with an order of magnitude of headroom, and it runs on this config alone, on one conditioning
            # axis. The mean is nearly free and still covers both axes, here and on three other configs.
            cdf: 0.005
            cdf_axes: [b]
        '[(1, 3)]':
          moments: 0.0001
          # the only conditional with an msprime ground truth: {R_on = 0} has positive probability, so the replicates
          # whose conditioning bin is empty *are* the conditioning set -- no window, no bandwidth bias. It is also the
          # only check that reaches value = 0, where the transform is an exact closed-form ratio rather than a nested
          # inversion. Wired on a handful of configs, since it needs its own cached ground truth.
          #
          # Only bin 3 has an atom here: for n = 4 every tree carries a doubleton branch, so bin 1 and bin 2 are never
          # empty. Conditioning on bin 1 therefore only asserts that its atom is zero on both sides.
          atom:
            mass: 0.0019
            mean: 0.0053
            var: 0.017
            cdf: 0.0035
            pdf: 0.0074
            quantile: 0.007
      pairwise:
        (1, 2):
          cdf: 0.0028
          pdf: 0.007
        "[(1, 3), (2, 3)]":
          cdf: 0.0026
          pdf: 0.0068
        (3, 3):
          cdf: 0.002
    empirical:
      tree_height:
        mean: 0.0064
        var: 0.024
        cdf: 0.0045
        pdf: 0.009
        quantile: 0.009
      total_branch_length:
        mean: 0.0056
        var: 0.022
      sfs:
        mean: 0.015
        m2: 0.015
