n: 4
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
model: standard
seed: 42
n_samples: 200000
comparisons:
  tolerance:
    tree_height:
      pdf: 0.016
      cdf: 0.0013
      quantile: 0.00098
      mean: 0.00018
      var: 0.0005
    total_branch_length:
      cosine:
        pdf: 0.012
        cdf: 0.00083
        quantile: 0.00075
      mean: 1.6e-05
      var: 0.00033
    sfs:
      mean: 0.0031
      cov: 0.012
      corr: 0.0093
      cosine:
        pdf: 0.012
        cdf: 0.0016
        quantile: 0.0037
      # self-consistency of the conditional path: no msprime operand, so any bin pair may be listed. ``moments`` pins
      # each conditional mean pointwise against the exact derivative identity. ``total_expectation`` is deliberately
      # NOT used here: it is 2-4x dearer and strictly weaker (integrated rather than pointwise, and its own
      # Gauss-Legendre quadrature, not the conditional, sets its floor). ``quantiles`` targets specific conditioning
      # values of the conditioning marginal (omit for the default 0.01-0.99 span), and ``curves`` draws that many
      # conditional densities per axis (~1 s each; nothing is asserted on them). On a single epoch the identity is
      # exact, so this pins the nested inversion to 1e-4.
      conditional:
        '[(1, 2)]':
          moments: 0.0001
          curves: 3        # densities are drawn on this pair only: each costs a 0.99 quantile of the nested transform
        '[(1, 3)]':
          moments: 0.0001
      pairwise:
        (1, 2):
          cdf: 0.0028
          pdf: 0.007
        "[(1, 3), (2, 3)]":
          cdf: 0.0026
          pdf: 0.0068
        (3, 3):
          cdf: 0.0014
    empirical:
      tree_height:
        mean: 0.0021
        var: 0.00051
        cdf: 0.0027
        pdf: 0.016
        quantile: 0.0027
      total_branch_length:
        mean: 0.0027
        var: 0.018
      sfs:
        mean: 0.0048
        m2: 0.015
