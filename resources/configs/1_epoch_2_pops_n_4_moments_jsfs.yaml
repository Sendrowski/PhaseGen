      pairwise:
        '[((0, 1), (1, 0)), ((0, 1), (1, 1)), ((1, 0), (1, 1))]':
          cdf: 0.0045
          pdf: 0.052
      mean: 0.009
      var: 0.009
      m2: 0.05
      m3: 0.016
