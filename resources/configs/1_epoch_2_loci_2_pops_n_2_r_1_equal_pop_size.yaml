        cov: 0.0096
        corr: 0.00051
      #demes:
      #  mean: 0.01
    total_branch_length:
      mean: 0.0027
      var: 0.0086
      loci:
        mean: 0.01
        var: 0.02
        cov: 0.0086
        corr: 0.00051
