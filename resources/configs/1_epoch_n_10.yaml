n: 10
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      pdf: 0.004
      cdf: 0.002
      mean: 0.0024
      var: 0.012
      quantile: 0.004
    total_branch_length:
      mean: 0.0017
      var: 0.0097
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.004
    sfs:
      mean: 0.013
      cov: 0.15
      corr: 0.15
      '[1, 4, 9]':
        cosine:
          pdf: 0.004
          cdf: 0.002
          quantile: 0.004
      conditional:
        '[(1, 2), (1, 9), (3, 6)]':
          moments: 0.0001
        '[(3, 6)]':
          # the atom conditional, against the msprime sample (see 1_epoch_n_4). Both bins are empty often enough here
          # to pin it on either axis.
          atom:
            mass: 0.002
            mean: 0.029
            var: 0.068
            cdf: 0.0084
            pdf: 0.017
            quantile: 0.031
        '[(1, 2)]':
          # the nested conditional against msprime: the only place a *sample* decides it away from the atom (every
          # other conditional check is an identity the analytic joint must satisfy, so an error shared by the
          # transform and the identity would pass them all). A sample can only estimate the conditional over a
          # window, so both sides are averaged over the same one and the O(h) window bias cancels rather than being
          # corrected for. Tolerances are in SIGMAS of the sample, the only floor left once the bias is gone.
          windowed:
            quantiles: [0.25, 0.5, 0.75]
            window: 0.2
            mean: 5
      pairwise:
        '[(1, 2), (1, 9), (2, 9)]':
          cdf: 0.002
          pdf: 0.007
    fsfs:
      mean: 0.011
      cov: 0.046
      corr: 0.042
