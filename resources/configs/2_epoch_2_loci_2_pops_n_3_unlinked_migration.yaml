# two loci, one of three lineages starting unlinked, migration recorded: covers the initial state of the simulation
# and the per-tree accumulation of the migration history over a tree sequence of several trees
n:
  pop_0: 2
  pop_1: 1
n_loci: 2
recombination_rate: 0.8
n_unlinked: 1
num_replicates: 1000000
record_migration: true
pop_sizes:
  pop_0:
    0: 1
    0.4: 2
  pop_1:
    0: 0.5
migration_rates:
  !!python/tuple [ 'pop_0', 'pop_1' ]:
    0: 0.6
  !!python/tuple [ 'pop_1', 'pop_0' ]:
    0: 1.1
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      mean: 0.003
      var: 0.0096
      loci:
        mean: 0.01
        var: 0.02
        cov: 0.021
        corr: 0.02
    total_branch_length:
      mean: 0.0027
      var: 0.0086
      loci:
        mean: 0.01
        var: 0.02
        cov: 0.021
        corr: 0.02
      demes:
        mean: 0.01
