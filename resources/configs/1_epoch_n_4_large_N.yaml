n: 4
num_replicates: 1000000
n_samples: 200000
simulate_mutations: true
mutation_rate: 1.0e-07      # 1 / N0, which puts theta * E[total branch length] at 3.7, the band the other configs sit in
mass_threshold: 0.9
pop_sizes:
  pop_0:
    0: 10000000
model: standard
seed: 42
comparisons:
  tolerance:
    # validate PhaseGen's own trajectory sampler here too: this scenario's rates sit far from unity, and the
    # hazard-budget sampler must be scale-free (it draws H / lambda, which carries no absolute time scale).
    empirical:
      tree_height:
        mean: 0.0064
        var: 0.024
        cdf: 0.0045
        pdf: 0.009
        quantile: 0.009
      total_branch_length:
        mean: 0.0056
        var: 0.022
      sfs:
        mean: 0.015
        m2: 0.05
    tree_height:
      pdf: 0.0049
      cdf: 0.002
      mean: 0.0028
      var: 0.011
      quantile: 0.004
    total_branch_length:
      mean: 0.0025
      var: 0.0096
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.004
    sfs:
      mutation_configs: 0.0048
      mean: 0.0063
      cov: 0.032
      corr: 0.032
      cosine:
        pdf: 0.0046
        cdf: 0.002
        quantile: 0.004
      # the conditional divides by f_on(v), and the inner Euler contour (u_k ~ 1/v) and the tau rescaling both hinge on
      # the reward's magnitude, so the large-N and small-N configs are where that machinery is actually stressed. The
      # transform is exact here; the cosine grid it is inverted onto costs an order of magnitude (0.9%), which is the
      # price of the large window and not a defect of the conditional.
      conditional:
        '[(1, 2)]':
          moments: 0.0001
          grid_moments: 0.014
        '[(1, 3)]':
          moments: 0.0001
          # the atom conditional against the msprime sample (see 1_epoch_n_4). A large-N demography, whose rewards
          # run to ~1e7: the atom transform is a ratio of transforms, so it has to be free of the reward scale.
          atom:
            mass: 0.0019
            mean: 0.0053
            var: 0.017
            cdf: 0.0035
            pdf: 0.0074
            quantile: 0.007
      pairwise:
        '[(1, 2), (1, 3), (2, 3)]':
          cdf: 0.0028
          pdf: 0.007
    fsfs:
      mutation_configs: 0.004
