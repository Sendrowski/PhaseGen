n:
  pop_0: 1
  pop_1: 1
num_replicates: 1000000
record_migration: true
migration_rates:
  !!python/tuple [ 'pop_0', 'pop_1' ]:
    0: 1
  !!python/tuple [ 'pop_1', 'pop_0' ]:
    0: 1
pop_sizes:
  pop_0:
    0: 1
  pop_1:
    0: 1
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      demes:
        mean: 0.01
        var: 0.02
        cov: 0.013
        corr: 0.0012
      pdf: 0.004
      cdf: 0.002
      mean: 0.0039
      var: 0.013
    total_branch_length:
      demes:
        mean: 0.01
        var: 0.02
        cov: 0.013
        corr: 0.0012
      mean: 0.0039
      var: 0.013
    sfs:
      demes:
        mean: 0.01
        # var: 0.02 variance not supported by MsprimeCoalescent
      mean: 0.0039
      cov: 0.013
      corr: 0.0005
