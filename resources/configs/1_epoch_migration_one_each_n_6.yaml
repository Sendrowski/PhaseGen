n:
  pop_0: 3
  pop_1: 3
num_replicates: 1000000
record_migration: true
migration_rates:
  ? !!python/tuple
  - 'pop_0'
  - 'pop_1'
  : 0: 1
  ? !!python/tuple
  - 'pop_1'
  - 'pop_0'
  : 0: 1
pop_sizes:
  pop_0:
    0: 1
  pop_1:
    0: 1
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      demes:
        mean: 0.01
        var: 0.02
      pdf: 0.032
      cdf: 0.0011
      mean: 0.0015
      var: 0.0098
    total_branch_length:
      demes:
        mean: 0.01
        var: 0.02
      mean: 0.00083
      var: 0.0074
    sfs:
      demes:
        mean: 0.01
        # var: 0.02 variance not supported by MsprimeCoalescent
      mean: 0.0054
      cov: 0.012
      corr: 0.0057
