n:
  pop_0: 3
  pop_1: 3
num_replicates: 1000000
record_migration: true
migration_rates:
  ? !!python/tuple
  - 'pop_0'
  - 'pop_1'
  : 0: 1
  ? !!python/tuple
  - 'pop_1'
  - 'pop_0'
  : 0: 1
pop_sizes:
  pop_0:
    0: 1
  pop_1:
    0: 1
model: standard
seed: 42
comparisons:
  tolerance:
    tree_height:
      demes:
        mean: 0.01
        var: 0.02
      pdf: 0.004
      cdf: 0.002
      mean: 0.0025
      var: 0.0094
    total_branch_length:
      demes:
        mean: 0.01
        var: 0.02
      mean: 0.002
      var: 0.0082
    sfs:
      demes:
        mean: 0.01
        # var: 0.02 variance not supported by MsprimeCoalescent
      mean: 0.0079
      cov: 0.046
      corr: 0.044
      conditional:
        '[(1, 2), (2, 5)]':
          moments: 0.0001

        '[(2, 5)]':
          # the atom conditional against the msprime sample (see 1_epoch_n_4). Two populations under migration, so the
          # atom conditional is pinned on a structured state space and not only on a panmictic one.
          atom:
            mass: 0.002
            mean: 0.0045
            var: 0.014
            cdf: 0.0026
            pdf: 0.0051
            quantile: 0.0051
