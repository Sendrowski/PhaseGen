n: 4
num_replicates: 1000000
simulate_mutations: true
mutation_rate: 0.000000001
mass_threshold: 0.9
pop_sizes:
  pop_0:
    0: 1000000000
model: standard
seed: 42
comparisons:
  tolerance:
    sfs:
      mutation_configs: 0.0048
      cosine:
        pdf: 0.0046
        cdf: 0.002
        quantile: 0.004
      # N = 1e9, the far end of the scale. The conditional is a branch-length quantity and so does not depend on the
      # mutation rate: it reports exactly what 1_epoch_n_4_large_N does (identity exact, grid 0.9%).
      conditional:
        '[(1, 2)]':
          moments: 0.0001
          grid_moments: 0.014
      pairwise:
        '[(1, 2), (1, 3), (2, 3)]':
          cdf: 0.0028
          pdf: 0.007
    fsfs:
      mutation_configs: 0.004
    tree_height:
      pdf: 0.0049
      cdf: 0.002
      quantile: 0.004
    total_branch_length:
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.004
