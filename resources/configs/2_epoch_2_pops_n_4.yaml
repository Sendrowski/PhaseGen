n:
  pop_0: 2
  pop_1: 2
num_replicates: 1000000
simulate_mutations: true
mutation_rate: 0.5
mass_threshold: 0.5
#record_migration: true
pop_sizes:
  pop_0:
    0: 0.5
    1: 0.5
  pop_1:
    0: 2
migration_rates:
  !!python/tuple [ 'pop_0', 'pop_1' ]:
    0: 1
  !!python/tuple [ 'pop_1', 'pop_0' ]:
    0: 0.2
model: standard
seed: 42
n_samples: 200000
comparisons:
  tolerance:
    tree_height:
      pdf: 0.004
      cdf: 0.002
      mean: 0.0028
      var: 0.0097
      #demes:
      #  mean: 0.01
    total_branch_length:
      mean: 0.0026
      var: 0.0088
      #demes:
      #  mean: 0.01
    fsfs:
      mutation_configs: 0.004
    sfs:
      mutation_configs: 0.004
      mean: 0.006
      var: 0.014
      cov: 0.019
      corr: 0.017
      conditional:
        '[(1, 2), (1, 3)]':
          moments: 0.0001
        '[(1, 3)]':
          # the atom conditional against the msprime sample (see 1_epoch_n_4): two populations and two epochs together.
          atom:
            mass: 0.002
            mean: 0.0052
            var: 0.02
            cdf: 0.0032
            pdf: 0.0063
            quantile: 0.0063
      #demes:
      #  mean: 0.01
    empirical:
      tree_height:
        mean: 0.0054
        var: 0.022
        cdf: 0.0045
        pdf: 0.009
        quantile: 0.009
      total_branch_length:
        mean: 0.0055
        var: 0.021
      sfs:
        mean: 0.014
        m2: 0.008
