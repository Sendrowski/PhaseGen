n:
  pop_0: 2
  pop_1: 2
num_replicates: 1000000
simulate_mutations: true
mutation_rate: 0.5
mass_threshold: 0.5
#record_migration: true
pop_sizes:
  pop_0:
    0: 0.5
    1: 0.5
  pop_1:
    0: 2
migration_rates:
  !!python/tuple [ 'pop_0', 'pop_1' ]:
    0: 1
  !!python/tuple [ 'pop_1', 'pop_0' ]:
    0: 0.2
model: standard
seed: 42
n_samples: 200000
