      mutation_configs: 0.0021
    sfs:
      mutation_configs: 0.0022
      mean: 0.002
      var: 0.0049
      cov: 0.0062
      corr: 0.0051
      conditional:
        '[(1, 2), (1, 3)]':
          moments: 0.0001
      #demes:
      #  mean: 0.01
    empirical:
      tree_height:
        mean: 0.003
        var: 0.0027
