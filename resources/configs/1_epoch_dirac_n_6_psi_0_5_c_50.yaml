n: 6
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
model: dirac
psi: 0.5
c: 50.0
seed: 42
comparisons:
  tolerance:
    tree_height:
      pdf: 0.0045
      cdf: 0.002
      mean: 0.0033
      var: 0.011
      quantile: 0.004
    total_branch_length:
      mean: 0.0027
      var: 0.0086
      cosine:
        pdf: 0.004
        cdf: 0.002
        quantile: 0.004
    sfs:
      mean: 0.011
      cov: 0.046
      corr: 0.048
      theta_pi: 0.004
      theta_w: 0.004
      tajimas_d: 0.004
      cosine:
        pdf: 0.0048
        cdf: 0.002
        quantile: 0.004
      conditional:
        '[(1, 2)]':
          moments: 0.0001
          grid_moments: 0.04
        # conditioning on the 5-ton of a psi = 0.5, c = 50 Dirac: the generator is stiff enough that the identity's
        # error here is set by roundoff in the augmented ``expm``, not by the algorithm, so it moves with the BLAS
        # summation order (5e-4 single-threaded, under 1e-4 multi-threaded). Pinned to the roundoff floor, not to
        # whichever of the two a given machine's core count happens to produce.
        '[(1, 5), (2, 5)]':
          moments: 0.001
        '[(2, 5)]':
          # the atom conditional against the msprime sample (see 1_epoch_n_4). A Dirac multiple-merger model, where a
          # single large merger empties whole frequency classes at once, so the atom is large on both axes.
          atom:
            mass: 0.002
            mean: 0.0084
            var: 0.02
            cdf: 0.0032
            pdf: 0.0064
            quantile: 0.0064
      pairwise:
        '[(1, 2), (1, 5), (2, 5)]':
          cdf: 0.002
          pdf: 0.005
