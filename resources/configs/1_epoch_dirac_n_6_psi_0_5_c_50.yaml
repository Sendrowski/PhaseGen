n: 6
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
model: dirac
psi: 0.5
c: 50.0
seed: 42
comparisons:
  tolerance:
    tree_height:
      pdf: 0.013
      cdf: 0.0013
      mean: 0.00014
      var: 0.0023
      quantile: 0.0011
    total_branch_length:
      mean: 0.00023
      var: 0.0029
      cosine:
        pdf: 0.012
        cdf: 0.00072
        quantile: 0.00054
    sfs:
      mean: 0.0026
      cov: 0.035
      corr: 0.036
      theta_pi: 0.00011
      theta_w: 0.00023
      tajimas_d: 0.0029
      cosine:
        pdf: 0.011
        cdf: 0.00087
        quantile: 0.0026
      conditional:
        '[(1, 2)]':
          moments: 0.0001
          grid_moments: 0.04
        # conditioning on the 5-ton of a psi = 0.5, c = 50 Dirac: the generator is stiff enough that the identity's
        # error here is set by roundoff in the augmented ``expm``, not by the algorithm, so it moves with the BLAS
        # summation order (5e-4 single-threaded, under 1e-4 multi-threaded). Pinned to the roundoff floor, not to
        # whichever of the two a given machine's core count happens to produce.
        '[(1, 5), (2, 5)]':
          moments: 0.001
      pairwise:
        '[(1, 2), (1, 5), (2, 5)]':
          cdf: 0.0014
          pdf: 0.005
