n: 6
num_replicates: 1000000
pop_sizes:
  pop_0:
    0: 1
model: beta
alpha: 1.1
seed: 42
comparisons:
  tolerance:
    tree_height:
      pdf: 0.004
      cdf: 0.002
      mean: 0.0028
      var: 0.0093
      quantile: 0.004
    total_branch_length:
      mean: 0.0024
      var: 0.0078
      cosine:
        pdf: 0.0042
        cdf: 0.002
        quantile: 0.004
    sfs:
      mean: 0.0085
      cov: 0.042
      corr: 0.041
      theta_pi: 0.004
      theta_w: 0.004
      tajimas_d: 0.004
      cosine:
        pdf: 0.005
        cdf: 0.002
        quantile: 0.0049
      conditional:
        '[(1, 2), (1, 5), (2, 5)]':
          moments: 0.0001
        '[(2, 5)]':
          # the atom conditional, against the msprime sample (see 1_epoch_n_4), on a multiple-merger model, where the
          # atom is large: a merger of many lineages leaves whole frequency classes empty.
          atom:
            mass: 0.002
            mean: 0.012
            var: 0.027
            cdf: 0.0041
            pdf: 0.0081
            quantile: 0.0084
        '[(1, 2)]':
          # the nested conditional against msprime: the only place a *sample* decides it away from the atom (every
          # other conditional check is an identity the analytic joint must satisfy, so an error shared by the
          # transform and the identity would pass them all). A sample can only estimate the conditional over a
          # window, so both sides are averaged over the same one and the O(h) window bias cancels rather than being
          # corrected for. Tolerances are in SIGMAS of the sample, the only floor left once the bias is gone.
          windowed:
            quantiles: [0.25, 0.5, 0.75]
            window: 0.2
            mean: 5
      pairwise:
        '[(1, 2), (1, 5), (2, 5)]':
          cdf: 0.002
          pdf: 0.0048
