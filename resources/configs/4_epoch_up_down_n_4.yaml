n: 4
n_samples: 200000
pop_sizes:
  pop_0:
    0: 1.2
    0.3: 10
    1: 0.8
    1.4: 10
model: standard
seed: 42
comparisons:
  tolerance:
    sfs:
      # the loosest conditional tolerance in the suite, and the limit here is the *reference*, not the conditional: on
      # this demography a 300M-replicate sampler puts E[R_2 | R_1 = v] at 7.725 at the median conditioning value, where
      # the nested inversion gives 7.710 (0.2%) and the derivative identity 7.788 (0.8%). The identity's error is de
      # Hoog's, non-monotone in the degree, so no setting buys it down. Tightening this would flag a fix as a failure.
      conditional:
        '[(1, 2), (1, 3)]':
          moments: 0.015
    empirical:
      tree_height:
        mean: 0.0032
        var: 0.00053
        cdf: 0.0026
        pdf: 0.075
        quantile: 0.0045
      total_branch_length:
        mean: 0.0049
        var: 0.019
      sfs:
        mean: 0.0071
        m2: 0.02
