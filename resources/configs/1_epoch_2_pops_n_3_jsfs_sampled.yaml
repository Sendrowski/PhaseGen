n:
  pop_0: 3
  pop_1: 3
n_samples: 200000
seed: 42
pop_sizes:
  pop_0:
    0: 1
  pop_1:
    0: 1.5
migration_rates:
  !!python/tuple ['pop_0', 'pop_1']: {0: 0.75}
  !!python/tuple ['pop_1', 'pop_0']: {0: 0.75}
model: standard
comparisons:
  tolerance:
    tree_height:
      mean: 0.02
      demes:
        mean: 0.03
        cov: 0.1
        corr: 0.1
    jsfs:
      mean: 0.05
      var: 0.1
      pairwise:
        cosine:
          '((0, 1), (1, 0))':
            cdf: 0.03
            pdf: 0.1
