name: docs-phasegen
channels:
  - conda-forge
dependencies:
  - python=3.12
  # from conda-forge rather than the pip wheels, which bundle two OpenBLAS libraries that stall each other when
  # multi-threaded; the versions match the requirements files, which pip then finds satisfied
  - numpy=2.4.6
  - scipy=1.17.1
  - ipykernel
  - nbconvert
  - r-base
  - r-reticulate>=1.41
  - r-ggplot2>=3.5
  - r-patchwork
  - r-irkernel
  - r-ragg
  - pip
  - pip:
    - msprime
    - stdpopsim
    - demesdraw
    # paths relative to .snakemake/conda, where snakemake copies this file before creating the env (--use-conda)
    - -r ../../envs/requirements.txt
    - -e ../..
