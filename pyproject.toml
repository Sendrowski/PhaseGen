[tool.poetry]
name = "phasegen"
version = "2.2.0"
description = "Computation and inference on exact solutions of coalescent distributions under diverse demographic scenarios."
authors = ["Janek Sendrowski <sendrowski.janek@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
typing-extensions = "^4.11.0"
matplotlib = "^3.8.4"
seaborn = "^0.13.2"
numpy = ">=1.26.4"
pandas = ">=2.2.2,<4"
jsonpickle = ">=3.0.4,<5"
multiprocess = "^0.70.16"
dill = ">=0.3.8"
pyyaml = "^6.0.1"
tqdm = "^4.66.2"
scipy = "^1.13.0"
sfsutils-popgen = "^1.1.2"
numba = ">=0.59"
threadpoolctl = ">=3.5"

[tool.poetry.group.dev.dependencies]
urllib3 = "^2.8"
# the optional msprime and demes interop, which the API reference resolves type hints against
msprime = ">=1.3"
demes = ">=0.2"
# 1.3.0 is the first release whose page-TOC scroll-spy works again. Cap <1.4, as 1.4.0
# (pydata-sphinx-theme 0.20) breaks the mobile sidebar toggle
sphinx_book_theme = "~1.3.0"
sphinx-autodoc-typehints = ">=2.1,<4"
sphinx-copybutton = "^0.5.2"
sphinx-paramlinks = ">=0.6"
myst-nb = "^1.1.0"
sphinx = ">=7.3.7,<10"
pygments = "^2.15.1"
autodocsumm = "^0.2.15"
sphinx-design = "^0.7.0"

[tool.pytest.ini_options]
testpaths = ["testing"]
# report the slowest tests on every run: the scenario comparisons are where runtime goes, and a check added to a
# config (a conditional grid, a pairwise surface) can cost tens of seconds without anything else showing it
addopts = "--durations=25 --durations-min=1.0"
markers = [
    "slow: marks tests as slow, e.g. msprime comparisons or large state spaces (deselect with '-m \"not slow\"')",
    "cosine: marks scenarios asserting a Fourier-cosine inverted curve, which Settings.cos_terms governs (select with '-m cosine')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
